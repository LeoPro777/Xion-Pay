version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xionpay_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xionpay_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_vault_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-xionpay_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xionpay_admin} -d ${POSTGRES_DB:-xionpay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xionpay_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xionpay_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
